<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        grid-template: repeat(4, 100px) / repeat(3, 1fr);
        gap: 10px;
      }

      .caixa1 {
        background-color: green;
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 1;
        grid-column-end: 4;
      }

      .caixa2 {
        background-color: blue;
        grid-row-start: 2;
        grid-row-end: 4;
        grid-column-start: 1;
        grid-column-end: 2;
      }

      .caixa3 {
        background-color: red;
        grid-row-start: 2;
        grid-row-end: 4;
        grid-column-start: 2;
        grid-column-end: 3;
      }

      .caixa4 {
        background-color: purple;
        grid-row-start: 2;
        grid-row-end: 4;
        grid-column-start: 3;
        grid-column-end: 4;
      }

      .caixa5 {
        background-color: yellow;
        grid-row-start: 4;
        grid-row-end: 5;
        grid-column-start: 1;
        grid-column-end: 4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="caixa1">Caixa 01</div>
      <div class="caixa2">Caixa 02</div>
      <div class="caixa3">Caixa 03</div>
      <div class="caixa4">Caixa 04</div>
      <div class="caixa5">Caixa 05</div>
    </div>
  </body>
</html>
