<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox</title>
    <style>
      .container {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap;
      }

      .item {
        background-color: lightblue;
        border: 1px solid black;
        flex: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">Valor do bloco A</div>
      <div class="item">Valor do bloco B</div>
      <div class="item">Valor do bloco C</div>
      <div class="item">Valor do bloco D</div>
      <div class="item">Valor do bloco E</div>
      <div class="item">Valor do bloco F</div>
      <div class="item">Valor do bloco G</div>
    </div>
  </body>
</html>
