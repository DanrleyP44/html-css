<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usando iframes</title>
    <style>
      iframe {
        height: 400px;
        width: 400px;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <h1>Usando iframes</h1>

    <p>
      Site do Curso em vídeo

      <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
        <a href="https://www.cursoemvideo.com">Curso em Vídeo</a>
      </iframe>

      para quem quer aprender a programar
    </p>

    <p>
      Repositório do Gunabara

      <iframe src="https://gustavoguanabara.github.io" frameborder="0">
        <a href="https://gustavoguanabara.github.io">GitHub</a>
      </iframe>

      no GitHub
    </p>
  </body>
</html>
