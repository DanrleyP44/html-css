<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionando conteúdos</title>
  </head>
  <body>
    <h1>Conteúdos dentro de iframes</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Consectetur ea,
      dicta velit tempora porro laudantium, similique obcaecati ut provident
      nobis, iusto tenetur vero rerum. Dicta quis necessitatibus dolorem esse
      cum.
    </p>

    <h2>Vídeos</h2>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/z3t3DUjLiQo?si=MEzjr2qy4m2SoKyw"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <h2>Mapas do Google</h2>

    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3980.8618880079575!2d-38.594784!3d-3.8398111999999993!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7c7526c1a34afb7%3A0x6b13737931ac2e82!2sR.%20Quatorze%20A%2C%2032%20-%20Industrial%2C%20Maracana%C3%BA%20-%20CE%2C%2061925-300!5e0!3m2!1spt-BR!2sbr!4v1779577831776!5m2!1spt-BR!2sbr"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <h2>Mapas do waze</h2>
    <iframe
      src="https://embed.waze.com/iframe?zoom=16&lat=-3.839811&lon=-38.594784&ct=livemap"
      width="600"
      height="450"
      allowfullscreen
    ></iframe>
  </body>
</html>
