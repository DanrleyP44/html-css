<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Estudo de Formulários</h1>

    <form action="ection.php" method="get" autocomplete="on">
      <p>
        <label for="iest">Estados: </label>
        <select name="est" id="iest">
          <optgroup label="Sudeste">
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
          </optgroup>

          <optgroup label="Nordeste">
            <option value="CE">Ceará</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="BA">Bahia</option>
          </optgroup>
        </select>
      </p>

      <p>
        <label for="iprof">Profissões: </label>
        <input type="text" name="prof" id="iprof" list="listProf" />
        <datalist id="listProf">
          <option>Desenvolvedor</option>
          <option>Professor</option>
          <option>Analista</option>
        </datalist>
      </p>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
