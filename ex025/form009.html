<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Estudo de fomrulários</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
      <p>
        <label for="irange">Range: </label>
        <input
          type="range"
          name="range"
          id="irange"
          min="1"
          max="10"
          value="5"
          oninput="changeRange()"
        />
        <output id="outRange">5</output>
      </p>
      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>

    <script>
      function changeRange() {
        outRange.innerHTML = Number(irange.value);
      }
    </script>
  </body>
</html>
