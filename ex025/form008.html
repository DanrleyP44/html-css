<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Estudo de Formulários</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
      <p>
        <label for="in1">Número 1: </label>
        <input type="number" name="n1" id="in1" oninput="soma()" />
      </p>

      <p>
        <label for="in2">Número 2: </label>
        <input type="number" name="n2" id="in2" oninput="soma()" />
      </p>

      <p>
        <label for="isoma">Soma: </label>
        <output id="isoma">0</output>
      </p>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>

    <script>
      function soma() {
        const soma = Number(in1.value) + Number(in2.value);
        isoma.innerHTML = soma;
      }
    </script>
  </body>
</html>
